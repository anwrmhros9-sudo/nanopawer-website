<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nanopawer Admin</title><link rel="stylesheet" href="/styles.css"><style>.admin{width:min(1000px,calc(100% - 30px));margin:30px auto}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;margin:16px 0}.admin-form{display:grid;grid-template-columns:1fr 1fr;gap:12px}.admin-form label{display:grid;gap:6px;color:var(--muted);font-size:12px}.admin-form input,.admin-form textarea,.admin-form select{width:100%;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:9px;padding:11px}.wide{grid-column:1/-1}.hidden{display:none!important}.list{display:grid;gap:9px}.item{padding:12px;border:1px solid var(--line);border-radius:10px;display:flex;justify-content:space-between;gap:12px}.muted{color:var(--muted);font-size:11px}.status{color:var(--yellow);font-size:12px}.login{max-width:420px;margin:9vh auto}.message{padding:12px 0;border-bottom:1px solid var(--line)}.message p{white-space:pre-wrap;color:var(--muted)}@media(max-width:600px){.admin-form{grid-template-columns:1fr}.wide{grid-column:auto}.item{flex-direction:column}}</style></head><body><main class="admin"><header class="heading"><a class="brand" href="/"><img src="/assets/avatar.png" alt=""><span>NANO<span class="accent">PAWER</span><small>ADMIN CONTROL</small></span></a><a class="btn ghost" href="/">العودة للموقع</a></header><section id="login" class="card login"><h2>دخول لوحة التحكم</h2><p class="muted">إدارة الأخبار والإعلانات والمعرض ورسائل التواصل.</p><form id="loginForm" class="admin-form" style="grid-template-columns:1fr"><label>اسم المستخدم<input name="username" autocomplete="username" required></label><label>كلمة المرور<input name="password" type="password" autocomplete="current-password" required></label><button class="btn primary">تسجيل الدخول</button><p id="loginStatus" class="status"></p></form></section><div id="dash" class="hidden"><section class="card"><h2>إضافة محتوى</h2><form id="postForm" class="admin-form"><label>النوع<select name="type"><option value="news">خبر</option><option value="announcement">إعلان</option><option value="gallery">معرض</option></select></label><label>رابط الصورة (اختياري)<input name="image_url" type="url" placeholder="https://..."></label><label>العنوان بالعربية<input name="title_ar" required maxlength="180"></label><label>English title<input name="title_en" required maxlength="180"></label><label class="wide">النص بالعربية<textarea name="body_ar"></textarea></label><label class="wide">English body<textarea name="body_en"></textarea></label><label><input name="published" type="checkbox" checked style="width:auto"> منشور للعامة</label><div class="wide"><button class="btn primary">نشر المحتوى</button> <button id="logout" type="button" class="btn ghost">خروج</button></div><p id="postStatus" class="status wide"></p></form></section><section class="card"><h2>المحتوى الحالي</h2><div id="posts" class="list">جارٍ التحميل...</div></section><section class="card"><h2>رسائل الزوار</h2><div id="messages" class="list">جارٍ التحميل...</div></section></div></main><script src="/admin.js"></script></body></html>
